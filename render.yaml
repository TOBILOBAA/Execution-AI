# Render Blueprint — Web Service for FastAPI backend (monorepo: requirements live in backend/)
# https://render.com/docs/blueprint-spec
#
# After connect: set env vars in the Render dashboard (Supabase, GOOGLE_AI_API_KEY, etc.).

services:
  - type: web
    name: execution-ai-api
    runtime: python
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
